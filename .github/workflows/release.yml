name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            os: ubuntu-latest
            archive: zag-${{ github.ref_name }}-x86_64-linux-musl.tar.gz
          - target: aarch64-linux-musl
            os: ubuntu-latest
            archive: zag-${{ github.ref_name }}-aarch64-linux-musl.tar.gz
          - target: x86_64-macos
            os: macos-latest
            archive: zag-${{ github.ref_name }}-x86_64-macos.tar.gz
          - target: aarch64-macos
            os: macos-latest
            archive: zag-${{ github.ref_name }}-aarch64-macos.tar.gz
          # Windows is blocked on file_log.zig using POSIX APIs.
          # Add x86_64-windows-gnu here once that is ported.
          # - target: x86_64-windows-gnu
          #   os: ubuntu-latest
          #   archive: zag-${{ github.ref_name }}-x86_64-windows-gnu.zip
          #   binary: zag.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dsim=false

      - name: Package (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          mkdir dist
          cp zig-out/bin/zag dist/
          cp LICENSE dist/ || true
          cp README.md dist/ || true
          tar czf ${{ matrix.archive }} -C dist .

      - name: Package (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: |
          mkdir dist
          cp zig-out/bin/zag.exe dist/
          cp LICENSE dist/ || true
          cp README.md dist/ || true
          cd dist && zip -r ../${{ matrix.archive }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > ../checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            checksums.txt
          generate_release_notes: true
