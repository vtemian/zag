name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: make fmt-check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux hits a Zig 0.16 x86_64-backend compiler SEGV compiling
          # zag (the same code builds and tests on macOS). Non-blocking
          # until the upstream compiler issue is resolved.
          - target: x86_64-linux
            os: ubuntu-latest
            allow-failure: true
          - target: aarch64-macos
            os: macos-latest

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .zig-cache
          key: ${{ runner.os }}-${{ matrix.target }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-zig-

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test

      # The zag-sim suite is parked until ghostty supports Zig 0.16
      # (https://github.com/ghostty-org/ghostty/pull/12726). The `test-sim`
      # build step only exists when sim is enabled, which pulls in ghostty.

  cross-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same Zig 0.16 Linux-backend compiler SEGV as the test job;
          # non-blocking until the upstream compiler issue is resolved.
          - target: aarch64-linux-musl
            os: ubuntu-latest
            allow-failure: true
          - target: x86_64-macos
            os: macos-latest

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .zig-cache
          key: ${{ runner.os }}-${{ matrix.target }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-zig-

      - name: Cross-compile
        run: zig build -Dtarget=${{ matrix.target }} -Dsim=false
